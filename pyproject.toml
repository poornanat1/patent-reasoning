[project]
name = "patent-reasoning"
version = "0.1.0"
description = "Comparing QLoRA fine-tuning and DSPy/GEPA prompt optimization for legal reasoning over USPTO examination records"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "duckdb>=1.1",
    "mlflow>=2.17",
    "polars>=1.9",
    "pyarrow>=17",
    "pydantic>=2.9",
    "pyyaml>=6",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
]

[project.optional-dependencies]
# GPU training stack (Phase 4-5). bitsandbytes 4-bit needs CUDA, so it is Linux-only.
train = [
    "torch>=2.4",
    "transformers>=4.45",
    "peft>=0.13",
    "trl>=0.11",
    "accelerate>=1.0",
    "bitsandbytes>=0.44; sys_platform == 'linux'",
]
# Prompt optimization (Phase 6). GEPA ships as dspy.GEPA.
optim = ["dspy>=3.0"]
eval = ["scikit-learn>=1.5"]
retrieval = ["faiss-cpu>=1.8", "sentence-transformers>=3.1"]
demo = ["gradio>=5.0"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patent_reasoning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
