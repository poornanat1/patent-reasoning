# Second audit, on the full build. A simple random sample within each split, excluding the
# first audit's examples, so its counts estimate each split's error rates directly.
name: dataset-audit-v2
seed: 42
tracking:
  tracking_uri: sqlite:///mlflow.db
  experiment: patent-reasoning
params:
  splits_dir: data/processed/splits
  cache_dir: data/raw/odp
  sheet_dir: data/interim/audit_v2
  sample: docs/reports/dataset_audit_v2_sample.json
  verdicts: docs/reports/dataset_audit_v2_verdicts.jsonl
  report: docs/reports/dataset_audit_v2_summary.json
  salt: audit-v2
  sampling: random
  exclude_samples: [docs/reports/dataset_audit_sample.json]
  quotas: {train: 80, val: 30, test: 40, ood_test: 20}
  batches: 4
